<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>particle-simulator</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #glcanvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 320px;
        height: 100vh;
        background: rgba(24, 24, 24, 0.85);
        color: #fff;
        font-family: sans-serif;
        z-index: 10;
        padding: 24px 20px 20px 20px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      #hud label {
        display: block;
        margin-bottom: 8px;
        font-size: 1rem;
      }
      #hud input[type="range"] {
        width: 100%;
      }
      #hud .slider-value {
        float: right;
        font-size: 0.95em;
        color: #aaffaa;
      }
      #hud button {
        font-size: 1.1em;
        padding: 8px 18px;
        background: #222;
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      #hud button:active {
        background: #333;
      }
      #fps-counter {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="hud">
      <button id="resetBtn">Reset settings</button>
      <button id="pauseBtn">Pause</button>
      <button id="randomiseBtn">Randomise</button>
      <div>
        <label for="particleCount">Particle count <span class="slider-value" id="particleCountValue">250</span></label>
        <input type="range" id="particleCount" min="0" max="3000" value="250" step="10">
      </div>
      <div>
        <label for="particleSize">Particle size <span class="slider-value" id="particleSizeValue">10</span></label>
        <input type="range" id="particleSize" min="1" max="25" value="10">
      </div>
      <div>
        <label for="repulsionRadius">Repulsion radius <span class="slider-value" id="repulsionRadiusValue">5.0</span></label>
        <input type="range" id="repulsionRadius" min="0.1" max="10" value="5.0" step="0.1">
      </div>
      <div>
        <label for="repulsionSpring">Repulsion strength <span class="slider-value" id="repulsionSpringValue">1.0</span></label>
        <input type="range" id="repulsionSpring" min="0.1" max="10.0" value="1.0" step="0.1">
      </div>
    </div>
    <div id="fps-counter">FPS: 0.0</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
